# FleetSplit

project:
  name: fleetsplit
  phase: 1

network:
  ssid: FLEETSPLIT-AP
  wpa2_psk: "fleetsplit-lab"          # change before real deployment
  subnet: 192.168.4.0/24
  server_ip: 192.168.4.1
  wifi_channel: 6                     # 2.4 GHz only - ESP32 radios have no 5 GHz band
  ap_interface: wlan0                 # host NIC that runs the soft-AP (`iw dev`); netem uses it too
  ports:
    control: 5001                     # heartbeat, assign, ack, abort, result
    data: 5002                        # tensor fragments, nack
  fragment_payload_bytes: 1400        # one 802.11 MTU frame; verify: ping -M do -s 1372

model:
  input_size: 96
  width_multiplier: 0.35
  num_classes: 2                      # Visual Wake Words: person / no-person
  jpeg_quality: 85                    # stored flash assets
  calibration_images: 500             # PTQ representative dataset (section 11.10-C)
  int8_accuracy_gate: 0.80            # model acceptance gate (section 11.10-C)
  flash_image_count: 50               # stored test images per flash-input node
  artifacts_dir: model/artifacts

# Cut points.
cuts:
  - name: k0
    boundary_op: null                 # full offload: JPEG on the air, full model on the server
    tensor_name: null
  - name: k_shallow                   # after inverted-residual block 2 (spec k2 role)
    boundary_op: 11                   # 24x24x8 = 4608 B on air
    tensor_name: "functional_1/block_2_add_1/Add"
  - name: k_deep                      # after inverted-residual block 6 (spec k4 role)
    boundary_op: 25                   # 6x6x24 = 864 B on air (< JPEG)
    tensor_name: "functional_1/block_6_project_BN_1/batchnorm/add_1;functional_1/block_6_project_1/convolution;functional_1/block_6_project_BN_1/batchnorm/sub"

# The fleet: one board per hardware tier.
nodes:
  - {node_id: 11, tier: A, ip: 192.168.4.11, mac: "80:b5:4e:d9:c6:40"}
  - {node_id: 21, tier: B, ip: 192.168.4.21, mac: "5c:01:3b:87:6d:dc"}
  - {node_id: 31, tier: C, ip: 192.168.4.31, mac: "8c:94:df:49:41:dc"}

# Feasible cuts per tier
tiers:
  A: {target: esp32s3, psram: true,  arena_kb: 512, cuts: [k0, k_shallow, k_deep]}
  B: {target: esp32,   psram: true,  arena_kb: 512, cuts: [k0, k_shallow, k_deep]}
  C: {target: esp32,   psram: false, arena_kb: 0,   cuts: [k0]}   # G3: see below

protocol:
  assign_ack_timeout_ms: 100
  assign_max_retries: 3
  nack_delay_ms: 20                   # after last received fragment, if incomplete
  max_nack_rounds: 3
  t_max_ms: 3000                      # abort a request that has not completed by then

registry:
  heartbeat_period_s: 1
  lost_after_s: 5

# There is deliberately no fleet-wide in-flight cap.
experiment:
  sweep_reqs_per_cut: 200             # per node, per cut - sets the p95 resolution
  min_ok_per_node: 200                # OK requests per node in a single-policy run
  node_inflight_cap: 1                # the ONLY concurrency limit - see below
  request_gap_ms: 50                  # pacing between a node's consecutive requests

logging:
  db_dir: runs

# Simulation-only knobs (scripts/sim_node.py; NOT used on hardware) - Synthetic
sim:
  goodput_bytes_per_s: {good: 900000, mid: 250000, bad: 45000}
  rssi_dbm: {A: -62, B: -50, C: -75}  # per-tier link profile (mid/good/bad bins)
  capture_ms: 2                       # SPIFFS read of the raw int8 tensor
  jpeg_read_ms: 1                     # SPIFFS read of the stored JPEG
  # Pre-hardware estimates
  t_edge_ms:                          # per tier, per arm, at 240 MHz
    A: {k_shallow: 15, k_deep: 50}
    B: {k_shallow: 35, k_deep: 120}
